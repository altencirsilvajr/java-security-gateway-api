spring:
  application:
    name: java-security-gateway-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
security:
  issuer: ${SECURITY_ISSUER:http://localhost:8080}
  api-clients:
    - client-id: ${SECURITY_CLIENT_ID:}
      key-sha256: ${SECURITY_API_KEY_SHA256:}
  quota:
    limit: ${SECURITY_QUOTA_LIMIT:30}
    window: ${SECURITY_QUOTA_WINDOW:1m}
